<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#546e7a"/>
    </marker>
    <linearGradient id="box1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#42a5f5"/>
      <stop offset="100%" stop-color="#1976d2"/>
    </linearGradient>
    <linearGradient id="box2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#66bb6a"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
    <linearGradient id="box3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff7043"/>
      <stop offset="100%" stop-color="#d84315"/>
    </linearGradient>
  </defs>
  <rect width="900" height="360" fill="#fafafa"/>

  <!-- Browser -->
  <g transform="translate(40,60)">
    <rect width="180" height="110" rx="12" fill="url(#box1)"/>
    <rect x="14" y="16" width="152" height="20" rx="6" fill="#ffffff" opacity="0.35"/>
    <text x="90" y="31" text-anchor="middle" font-family="Arial" font-size="12" fill="#ffffff">mikhmonww.test</text>
    <text x="90" y="65" text-anchor="middle" font-family="Arial" font-size="17" font-weight="bold" fill="#ffffff">Browser</text>
    <text x="90" y="88" text-anchor="middle" font-family="Arial" font-size="12" fill="#e3f2fd">Admin / Kasir</text>
  </g>

  <!-- Mikhmon -->
  <g transform="translate(360,45)">
    <rect width="180" height="140" rx="12" fill="url(#box2)"/>
    <g transform="translate(72,18)" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round">
      <path d="M0 18 A28 28 0 0 1 40 18"/>
      <path d="M8 26 A17 17 0 0 1 32 26"/>
      <circle cx="20" cy="36" r="3.5" fill="#ffffff" stroke="none"/>
    </g>
    <text x="90" y="90" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="#ffffff">MIKHMON v3.77</text>
    <text x="90" y="112" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#e8f5e9">PHP 8.4 + Apache/Nginx</text>
    <text x="90" y="128" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#c8e6c9">Failover ISP &#8226; CRUD Admin</text>
  </g>

  <!-- Router -->
  <g transform="translate(680,60)">
    <rect width="180" height="110" rx="12" fill="url(#box3)"/>
    <circle cx="55" cy="55" r="22" fill="none" stroke="#ffffff" stroke-width="4"/>
    <circle cx="55" cy="55" r="4" fill="#ffffff"/>
    <path d="M77 55 L92 55" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
    <text x="90" y="95" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#ffffff">MikroTik API</text>
  </g>

  <!-- ISP lines to router -->
  <g stroke="#90a4ae" stroke-width="3" stroke-dasharray="6 4" fill="none">
    <path d="M800 30 L800 58" marker-end="url(#arrow)"/>
  </g>
  <text x="815" y="38" font-family="Consolas, monospace" font-size="13" fill="#546e7a">ISP 1 (utama)</text>
  <g stroke="#ef5350" stroke-width="3" stroke-dasharray="6 4" fill="none">
    <path d="M868 30 L868 58" marker-end="url(#arrow)" stroke="#ef5350"/>
  </g>
  <text x="700" y="38" font-family="Consolas, monospace" font-size="13" fill="#ef5350">ISP 2 (failover)</text>

  <!-- Arrows -->
  <line x1="222" y1="115" x2="356" y2="115" stroke="#546e7a" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="289" y="103" text-anchor="middle" font-family="Arial" font-size="12" fill="#546e7a">HTTP</text>
  <line x1="542" y1="115" x2="676" y2="115" stroke="#546e7a" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="609" y="103" text-anchor="middle" font-family="Arial" font-size="12" fill="#546e7a">API :8728</text>

  <!-- Legend -->
  <g transform="translate(40,250)">
    <rect width="820" height="80" rx="10" fill="#eceff1"/>
    <text x="24" y="32" font-family="Arial" font-size="14" font-weight="bold" fill="#37474f">Fitur utama:</text>
    <text x="24" y="58" font-family="Consolas, monospace" font-size="13" fill="#546e7a">Manajemen voucher &amp; user hotspot &#8226; Multi admin (CRUD) &#8226; Failover dua ISP via System &#8594; Failover &#8226; Laporan penjualan</text>
  </g>
</svg>