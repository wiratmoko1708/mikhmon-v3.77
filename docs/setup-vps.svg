<svg xmlns="http://www.w3.org/2000/svg" width="860" height="200" viewBox="0 0 860 200">
  <defs>
    <linearGradient id="hdr2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#26a69a"/>
      <stop offset="100%" stop-color="#00695c"/>
    </linearGradient>
  </defs>
  <rect width="860" height="200" rx="14" fill="#f4fffd"/>
  <rect width="860" height="52" rx="14" fill="url(#hdr2)"/>
  <rect y="38" width="860" height="14" fill="url(#hdr2)"/>
  <!-- server icon -->
  <g transform="translate(20,12)" stroke="#ffffff" stroke-width="3" fill="none">
    <rect x="0" y="0" width="22" height="9" rx="2"/>
    <rect x="0" y="13" width="22" height="9" rx="2"/>
    <circle cx="5" cy="4.5" r="1.5" fill="#ffffff"/><circle cx="5" cy="17.5" r="1.5" fill="#ffffff"/>
  </g>
  <text x="62" y="35" font-family="Arial" font-size="22" font-weight="bold" fill="#ffffff">Setup di VPS (Ubuntu / Debian)</text>

  <g font-family="Consolas, Menlo, monospace" font-size="12.5">
    <g transform="translate(24,72)">
      <rect width="250" height="100" rx="10" fill="#ffffff" stroke="#b2dfdb"/>
      <circle cx="26" cy="26" r="14" fill="#00695c"/><text x="26" y="31" text-anchor="middle" fill="#fff" font-weight="bold">1</text>
      <text x="50" y="30" fill="#004d40" font-weight="bold">Install Stack</text>
      <text x="14" y="56" fill="#37474f">apt install nginx</text>
      <text x="14" y="76" fill="#37474f">php8.4-fpm php8.4-*</text>
    </g>
    <g transform="translate(296,72)">
      <rect width="270" height="100" rx="10" fill="#ffffff" stroke="#b2dfdb"/>
      <circle cx="26" cy="26" r="14" fill="#00695c"/><text x="26" y="31" text-anchor="middle" fill="#fff" font-weight="bold">2</text>
      <text x="50" y="30" fill="#004d40" font-weight="bold">Deploy Project</text>
      <text x="14" y="58" fill="#37474f">git clone ke /var/www</text>
      <text x="14" y="78" fill="#00796b">chown -R www-data:www-data</text>
    </g>
    <g transform="translate(588,72)">
      <rect width="248" height="100" rx="10" fill="#ffffff" stroke="#b2dfdb"/>
      <circle cx="26" cy="26" r="14" fill="#00695c"/><text x="26" y="31" text-anchor="middle" fill="#fff" font-weight="bold">3</text>
      <text x="50" y="30" fill="#004d40" font-weight="bold">Buka Port</text>
      <text x="14" y="58" fill="#37474f">ufw allow 80/tcp</text>
      <text x="14" y="78" fill="#00796b">akses http://IP-VPS</text>
    </g>
  </g>
</svg>